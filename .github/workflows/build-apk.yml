name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java (11)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties') }}

      - name: Cache Pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}

      - name: Install Flutter SDK (manual, robust)
        run: |
          set -euo pipefail
          # Ensure no stale flutter checkout in workspace
          if [ -d "${{ github.workspace }}/flutter" ]; then
            echo "Removing existing flutter directory"
            rm -rf "${{ github.workspace }}/flutter"
          fi
          # Install explicit Flutter SDK (contains Dart >= 3.9.2)
          FLUTTER_VERSION="3.35.7"
          FLUTTER_TAR="flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          DOWNLOAD_URL="https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/${FLUTTER_TAR}"
          echo "Downloading Flutter from: $DOWNLOAD_URL"
          curl -sSfL "$DOWNLOAD_URL" -o "$FLUTTER_TAR"
          echo "Extracting $FLUTTER_TAR"
          tar -xJf "$FLUTTER_TAR"
          # Ensure extracted dir is named 'flutter'
          if [ ! -d "flutter" ]; then
            echo "Expected extracted directory 'flutter' not found" >&2
            ls -la
            exit 1
          fi
          echo "Adding flutter to PATH"
          echo "${{ github.workspace }}/flutter/bin" >> $GITHUB_PATH
          export PATH="${{ github.workspace }}/flutter/bin:$PATH"
          echo "Flutter version (installed):"
          flutter --version || true
          echo "Dart version:"
          dart --version || true
          echo "Pre-caching Flutter artifacts"
          flutter precache --android || true

      - name: Accept Android SDK licenses
        run: |
          set -e
          # Accept Android licenses non-interactively to allow builds on runner
          yes | flutter doctor --android-licenses || true

      - name: Network diagnostics
        run: |
          echo "== Runner environment =="
          uname -a || true
          echo "== Java version =="
          java -version || true
          echo "== Gradle wrapper version =="
          ./gradlew --version || true

          echo "== Check Google Maven (AGP path) =="
          curl -I -s -o /dev/null -w "%{http_code} %{url_effective}\n" https://dl.google.com/dl/android/maven2/com/android/tools/build/gradle/8.1.4/ || true

          echo "== Check Gradle Plugin Portal (kotlin-dsl) =="
          curl -I -s -o /dev/null -w "%{http_code} %{url_effective}\n" https://plugins.gradle.org/m2/org/gradle/kotlin/kotlin-dsl/org.gradle.kotlin.kotlin-dsl.gradle.plugin/5.1.2/ || true


      - name: Flutter doctor
        run: flutter doctor -v

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK (debug)
        run: |
          set -e
          # capture full build output to build.log while also showing it in runner
          flutter build apk --debug 2>&1 | tee build.log

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mind-pause-apk
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build.log
