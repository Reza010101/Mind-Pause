name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java (11)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties') }}

      - name: Cache Pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'

      - name: Network diagnostics
        run: |
          echo "== Runner environment =="
          uname -a || true
          echo "== Java version =="
          java -version || true
          echo "== Gradle wrapper version =="
          ./gradlew --version || true

          echo "== Check Google Maven (AGP path) =="
          curl -I -s -o /dev/null -w "%{http_code} %{url_effective}\n" https://dl.google.com/dl/android/maven2/com/android/tools/build/gradle/8.1.4/ || true

          echo "== Check Gradle Plugin Portal (kotlin-dsl) =="
          curl -I -s -o /dev/null -w "%{http_code} %{url_effective}\n" https://plugins.gradle.org/m2/org/gradle/kotlin/kotlin-dsl/org.gradle.kotlin.kotlin-dsl.gradle.plugin/5.1.2/ || true


      - name: Flutter doctor
        run: flutter doctor -v

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK (debug)
        run: |
          set -e
          # capture full build output to build.log while also showing it in runner
          flutter build apk --debug 2>&1 | tee build.log

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mind-pause-apk
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build.log
